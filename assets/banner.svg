<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-label="Sadiq Mansoor - Software Engineer and Applied ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.52" stop-color="#12327a"/>
      <stop offset="1" stop-color="#0e7c74"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <!-- decorative glows -->
  <circle cx="1090" cy="70" r="230" fill="url(#glow)"/>
  <circle cx="1210" cy="290" r="180" fill="#3b82f6" opacity="0.16"/>

  <!-- subtle circuit-style lines, right side -->
  <g stroke="#7fe7dd" stroke-width="1.4" opacity="0.30" fill="none">
    <path d="M980 60 H1120 a10 10 0 0 1 10 10 V150"/>
    <path d="M1030 250 H1150 a10 10 0 0 0 10 -10 V120"/>
    <circle cx="980" cy="60" r="4" fill="#7fe7dd" stroke="none"/>
    <circle cx="1030" cy="250" r="4" fill="#7fe7dd" stroke="none"/>
    <circle cx="1160" cy="120" r="4" fill="#22d3ee" stroke="none"/>
  </g>

  <!-- left accent bar -->
  <rect x="92" y="92" width="7" height="140" rx="3.5" fill="url(#accent)"/>

  <!-- headline text -->
  <text x="126" y="150" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1.5">Sadiq Mansoor</text>
  <text x="128" y="196" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#d5e6ff" letter-spacing="0.6">Software Engineer &amp; Applied ML</text>
  <text x="128" y="232" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#7fe7dd" letter-spacing="3">LLM / RAG SYSTEMS  •  APPLIED ML RESEARCH  •  FULL-STACK AI PRODUCTS</text>

  <!-- tagline chip -->
  <g>
    <rect x="126" y="256" width="330" height="34" rx="17" fill="url(#chip)" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="148" y="279" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eaf6ff">I build AI that ships, not demos.</text>
  </g>
</svg>
